name: Accessibility

on:
  push:
    branches: [main]
  pull_request:

jobs:
  a11y:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Hugo
        run: sudo apt-get update && sudo apt-get install -y hugo

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: |
          npm run css:build
          npm run build

      - name: axe accessibility checks
        run: npm run a11y