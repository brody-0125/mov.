<header id="site-header" class="fixed top-0 left-0 right-0 z-50 transition-all duration-300 ease-in-out border-b bg-white border-transparent py-6">
  <div class="max-w-7xl mx-auto px-4 md:px-6 flex items-center justify-between">
    <!-- Logo -->
    <a href="/" class="text-2xl font-serif font-bold tracking-tighter text-black hover:opacity-70 transition-opacity">
      {{ .Site.Params.blogName | default .Site.Title }}
    </a>

    <!-- Desktop Nav -->
    <nav class="hidden md:flex items-center space-x-10">
      {{ range .Site.Menus.main }}
      <a
        href="{{ .URL }}"
        class="text-sm font-medium tracking-wide transition-colors duration-200 {{ if $.IsMenuCurrent "main" . }}text-black{{ else }}text-gray-500 hover:text-black{{ end }}"
      >
        {{ .Name }}
      </a>
      {{ end }}
    </nav>

    <!-- Search & Actions -->
    <div class="flex items-center space-x-4">
      <!-- Search Input -->
      <div class="relative hidden md:block">
        <svg class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.3-4.3"></path>
        </svg>
        <input
          id="search-input"
          type="text"
          placeholder="Search..."
          class="w-48 lg:w-56 py-1.5 pl-9 pr-3 text-sm text-gray-900 bg-gray-100 rounded-lg border border-transparent focus:border-gray-300 focus:bg-white outline-none transition-all placeholder-gray-500"
        />
        <!-- Search Results Dropdown -->
        <div id="search-results" class="absolute top-full left-0 right-0 mt-2 bg-white rounded-lg shadow-lg border border-gray-200 overflow-hidden hidden z-50">
          <div id="search-results-list" class="max-h-80 overflow-y-auto"></div>
          <div id="search-no-results" class="hidden py-6 text-center text-sm text-gray-500">No results found</div>
        </div>
      </div>

      <button
        id="mobile-menu-toggle"
        class="md:hidden text-black p-2 min-w-[44px] min-h-[44px] flex items-center justify-center"
        aria-label="Toggle menu"
      >
        <svg id="menu-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="4" x2="20" y1="12" y2="12"></line>
          <line x1="4" x2="20" y1="6" y2="6"></line>
          <line x1="4" x2="20" y1="18" y2="18"></line>
        </svg>
        <svg id="close-icon" class="hidden" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 6 6 18"></path>
          <path d="m6 6 12 12"></path>
        </svg>
      </button>
    </div>
  </div>

  <!-- Mobile Menu -->
  <div id="mobile-menu" class="md:hidden absolute top-full left-0 w-full bg-white border-b border-gray-100 transition-all duration-300 overflow-hidden max-h-0 opacity-0">
    <div class="p-4">
      <!-- Mobile Search -->
      <div class="relative mb-4">
        <input
          id="mobile-search-input"
          type="text"
          placeholder="Search..."
          class="w-full py-2.5 pl-10 pr-4 text-base text-gray-900 bg-gray-100 rounded-lg border border-transparent focus:border-gray-300 focus:bg-white outline-none transition-all placeholder-gray-500"
        />
        <svg class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.3-4.3"></path>
        </svg>
        <!-- Mobile Search Results -->
        <div id="mobile-search-results" class="absolute top-full left-0 right-0 mt-2 bg-white rounded-lg shadow-lg border border-gray-200 overflow-hidden hidden z-50">
          <div id="mobile-search-results-list" class="max-h-60 overflow-y-auto"></div>
          <div id="mobile-search-no-results" class="hidden py-6 text-center text-sm text-gray-500">No results found</div>
        </div>
      </div>
      <!-- Mobile Nav Links -->
      <nav class="flex flex-col space-y-3">
        {{ range .Site.Menus.main }}
        <a
          href="{{ .URL }}"
          class="text-lg font-medium text-gray-600 hover:text-black py-1"
        >
          {{ .Name }}
        </a>
        {{ end }}
      </nav>
    </div>
  </div>
</header>
